# Netlify 배포 설정 — Netlify UI의 Publish directory 가 저장소 루트로 잡혀 있으면 플러그인이 실패하므로 toml 에서 .next 로 고정합니다.
# 환경변수(KMA_SERVICE_KEY, KAKAO_REST_API_KEY)는 Netlify 대시보드
#   Site configuration → Environment variables 에서 등록하세요. (이 저장소에 키를 넣지 마세요)
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"
